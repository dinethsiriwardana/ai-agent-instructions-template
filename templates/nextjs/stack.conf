STACK_LABEL="Next.js"
QUALITY_GATE="pnpm typecheck && pnpm lint && pnpm test && pnpm build"

setup_stack() {
  local target="$1"
  if ! command -v node >/dev/null 2>&1; then
    echo "⚠️  'node' not found in PATH. Skipping automatic package installation."
    return 0
  fi

  (
    cd "$target"

    local pm="npm"
    if command -v pnpm >/dev/null 2>&1; then
      pm="pnpm"
    fi

    if [[ ! -f "package.json" ]]; then
      echo "📦 Scaffolding Next.js app in $target..."
      if [[ "$pm" == "pnpm" ]]; then
        pnpm create next-app@latest . --ts --tailwind --eslint --app --src-dir --import-alias "@/*" --use-pnpm --yes
      else
        npx create-next-app@latest . --ts --tailwind --eslint --app --src-dir --import-alias "@/*" --use-npm --yes
      fi
    fi

    echo "📦 Installing Next.js runtime dependencies ($pm)..."
    if [[ "$pm" == "pnpm" ]]; then
      pnpm add zod drizzle-orm @tanstack/react-query react-hook-form @hookform/resolvers server-only postgres next-intl
      echo "📦 Installing Next.js dev dependencies ($pm)..."
      pnpm add -D drizzle-kit vitest @vitejs/plugin-react playwright @playwright/test prettier
    else
      npm install zod drizzle-orm @tanstack/react-query react-hook-form @hookform/resolvers server-only postgres next-intl
      echo "📦 Installing Next.js dev dependencies ($pm)..."
      npm install -D drizzle-kit vitest @vitejs/plugin-react playwright @playwright/test prettier
    fi

    echo "🔧 Updating package.json scripts..."
    node -e '
      const fs = require("fs");
      const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
      pkg.scripts = Object.assign({
        dev: "next dev",
        build: "next build",
        start: "next start",
        lint: "eslint ."
      }, pkg.scripts, {
        typecheck: "tsc --noEmit",
        test: "vitest run",
        "test:watch": "vitest",
        "test:e2e": "playwright test",
        "db:generate": "drizzle-kit generate",
        "db:migrate": "drizzle-kit migrate",
        "db:studio": "drizzle-kit studio"
      });
      fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
    '

    mkdir -p src/features src/components/ui src/lib src/db src/types
  )
}

