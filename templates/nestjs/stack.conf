STACK_LABEL="NestJS"
QUALITY_GATE="pnpm typecheck && pnpm lint && pnpm test && pnpm test:e2e && pnpm build"

setup_stack() {
  local target="$1"
  if ! command -v node >/dev/null 2>&1; then
    echo "⚠️  'node' not found in PATH. Skipping automatic package installation."
    return 0
  fi

  (
    cd "$target"

    local pm="npm"
    if command -v pnpm >/dev/null 2>&1; then
      pm="pnpm"
    fi

    if [[ ! -f "package.json" ]]; then
      echo "📦 Scaffolding NestJS app in $target..."
      npx @nestjs/cli@latest new . --package-manager "$pm" --strict --skip-git
    fi

    echo "📦 Installing NestJS runtime dependencies ($pm)..."
    if [[ "$pm" == "pnpm" ]]; then
      pnpm add zod nestjs-zod drizzle-orm @nestjs/config @nestjs/swagger @nestjs/throttler @nestjs/terminus nestjs-pino pino-http helmet postgres nestjs-i18n
      echo "📦 Installing NestJS dev dependencies ($pm)..."
      pnpm add -D drizzle-kit pino-pretty supertest @types/supertest
    else
      npm install zod nestjs-zod drizzle-orm @nestjs/config @nestjs/swagger @nestjs/throttler @nestjs/terminus nestjs-pino pino-http helmet postgres nestjs-i18n
      echo "📦 Installing NestJS dev dependencies ($pm)..."
      npm install -D drizzle-kit pino-pretty supertest @types/supertest
    fi

    echo "🔧 Updating package.json scripts..."
    node -e '
      const fs = require("fs");
      const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
      pkg.scripts = Object.assign({
        "start:dev": "nest start --watch",
        build: "nest build",
        lint: "eslint .",
        test: "jest",
        "test:e2e": "jest --config ./test/jest-e2e.json"
      }, pkg.scripts, {
        typecheck: "tsc --noEmit",
        "db:generate": "drizzle-kit generate",
        "db:migrate": "drizzle-kit migrate",
        "db:studio": "drizzle-kit studio"
      });
      fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
    '

    mkdir -p src/common src/config src/database src/modules
  )
}

