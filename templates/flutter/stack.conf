STACK_LABEL="Flutter"
QUALITY_GATE="dart format --set-exit-if-changed . && flutter analyze && flutter test --coverage && flutter build apk --debug"

setup_stack() {
  local target="$1"
  if ! command -v flutter >/dev/null 2>&1; then
    echo "⚠️  'flutter' CLI not found in PATH. Skipping automatic package installation."
    return 0
  fi

  (
    cd "$target"

    if [[ ! -f "pubspec.yaml" ]]; then
      local app_slug
      app_slug="$(basename "$target" | tr '[:upper:]- ' '[:lower:]__')"
      [[ "$app_slug" =~ ^[a-z][a-z0-9_]*$ ]] || app_slug="app"
      echo "📦 Running flutter create in $target (project-name: $app_slug)..."
      flutter create . --project-name "$app_slug"
    fi

    echo "📦 Installing Flutter runtime dependencies..."
    flutter pub add \
      flutter_bloc \
      bloc_concurrency \
      go_router \
      dio \
      get_it \
      freezed_annotation \
      json_annotation \
      equatable \
      flutter_secure_storage \
      intl \
      'flutter_localizations:{"sdk":"flutter"}'

    echo "📦 Installing Flutter dev dependencies..."
    flutter pub add --dev \
      build_runner \
      freezed \
      json_serializable \
      bloc_test \
      mocktail \
      flutter_lints

    # Ensure `generate: true` is enabled under `flutter:` in pubspec.yaml for l10n
    if ! grep -q "^  generate: true" pubspec.yaml 2>/dev/null; then
      perl -0777 -pi -e 's/\nflutter:\s*\n/\nflutter:\n  generate: true\n/' pubspec.yaml
    fi

    # Create standard architecture directories under lib/
    mkdir -p lib/core/error lib/core/network lib/core/theme lib/core/router lib/core/di lib/features

    # Create environment config templates
    mkdir -p env
    if [[ ! -f "env/example.json" ]]; then
      cat > env/example.json <<'EOF'
{
  "API_BASE_URL": "https://api.example.com",
  "FLAVOR": "dev"
}
EOF
    fi
    if [[ ! -f "env/dev.json" ]]; then
      cp env/example.json env/dev.json
    fi
    if [[ -f ".gitignore" ]] && ! grep -q "env/dev.json" .gitignore; then
      printf "\n# Local environment defines\nenv/dev.json\nenv/staging.json\nenv/prod.json\n" >> .gitignore
    fi

    echo "🌐 Generating localization files (flutter gen-l10n)..."
    flutter gen-l10n || true
  )
}

