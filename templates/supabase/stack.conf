STACK_LABEL="Supabase"
QUALITY_GATE="pnpm typecheck && pnpm lint && pnpm test && pnpm build"

setup_stack() {
  local target="$1"
  if ! command -v node >/dev/null 2>&1; then
    echo "⚠️  'node' not found in PATH. Skipping automatic package installation."
    return 0
  fi

  (
    cd "$target"

    local pm="npm"
    if command -v pnpm >/dev/null 2>&1; then
      pm="pnpm"
    fi

    if [[ ! -f "package.json" ]]; then
      echo "📦 Initializing package.json in $target..."
      if [[ "$pm" == "pnpm" ]]; then
        pnpm init >/dev/null 2>&1 || npm init -y >/dev/null 2>&1
      else
        npm init -y >/dev/null 2>&1
      fi
    fi

    echo "📦 Installing Supabase runtime dependencies ($pm)..."
    if [[ "$pm" == "pnpm" ]]; then
      pnpm add @supabase/supabase-js zod
      echo "📦 Installing Supabase CLI & TypeScript dev dependencies ($pm)..."
      pnpm add -D supabase typescript tsx vitest @types/node prettier eslint
    else
      npm install @supabase/supabase-js zod
      echo "📦 Installing Supabase CLI & TypeScript dev dependencies ($pm)..."
      npm install -D supabase typescript tsx vitest @types/node prettier eslint
    fi

    if [[ ! -f "supabase/config.toml" ]]; then
      echo "⚡ Initializing Supabase CLI configuration..."
      npx supabase init >/dev/null 2>&1 || mkdir -p supabase/migrations supabase/tests supabase/functions/_shared
    fi

    mkdir -p \
      supabase/migrations \
      supabase/tests \
      supabase/functions/_shared \
      src/config \
      src/types \
      src/lib/supabase \
      src/features

    if [[ ! -f "tsconfig.json" ]]; then
      cat > tsconfig.json << 'EOF'
{
  "compilerOptions": {
    "target": "ES2022",
    "module": "ESNext",
    "moduleResolution": "Bundler",
    "strict": true,
    "esModuleInterop": true,
    "skipLibCheck": true,
    "forceConsistentCasingInFileNames": true,
    "resolveJsonModule": true,
    "noEmit": true,
    "paths": {
      "@/*": ["./src/*"]
    }
  },
  "include": ["src/**/*.ts"],
  "exclude": ["node_modules", "supabase/functions"]
}
EOF
    fi

    echo "🔧 Updating package.json scripts..."
    node -e '
      const fs = require("fs");
      const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
      pkg.scripts = Object.assign({
        build: "tsc --noEmit",
        lint: "tsc --noEmit"
      }, pkg.scripts, {
        typecheck: "tsc --noEmit",
        test: "vitest run --passWithNoTests",
        "test:watch": "vitest",
        "test:db": "supabase test db",
        "sb:start": "supabase start",
        "sb:stop": "supabase stop",
        "sb:status": "supabase status",
        "db:migration:new": "supabase migration new",
        "db:reset": "supabase db reset",
        "db:lint": "supabase db lint",
        "db:types": "supabase gen types typescript --local > src/types/database.types.ts",
        "db:migrate:dev": "supabase db push",
        "db:migrate:prod": "node -e \"if(process.env.CI!==\\\"true\\\"&&process.env.VERCEL_ENV!==\\\"production\\\"){console.error(\\\"Blocked: db:migrate:prod only runs in CI on main\\\");process.exit(1)}\" && supabase db push",
        "fn:serve": "supabase functions serve",
        "fn:deploy": "supabase functions deploy",
        "branch:start": "node scripts/git-flow.mjs start",
        "branch:sync": "node scripts/git-flow.mjs sync",
        "branch:pr": "node scripts/git-flow.mjs pr",
        "branch:finish": "node scripts/git-flow.mjs finish",
        "branch:list": "node scripts/git-flow.mjs list"
      });
      fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
    '
  )
}

